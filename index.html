<style>
/* Layout: una sola columna estrecha tipo marcador; banda azul de pista arriba, tarjetas de pareja y agenda por día debajo. */
:root{
  --bg:#eef2f6; --surface:#ffffff; --sunk:#e3e9f0; --line:#d3dce6;
  --fg:#14202e; --muted:#5b6a7c;
  --court:#1d4f91; --court-ink:#ffffff; --ball:#d9ea3c; --ball-ink:#1f2a05;
  --ok:#1f8a4c; --warn:#b7791f; --bad:#c0392b;
  --t1:#d1495b; --t2:#1d8a8a; --t3:#7b4fc9; --t4:#c7782a;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d141d; --surface:#152130; --sunk:#1b2a3c; --line:#26384d;
  --fg:#e6edf5; --muted:#93a3b6;
  --court:#163c6e; --court-ink:#f2f6fb; --ball:#d4e544; --ball-ink:#1c2604;
  --ok:#43c07a; --warn:#e3a94a; --bad:#ef6b5c;
  --t1:#f07083; --t2:#3fbdbd; --t3:#a888f0; --t4:#ea9d52; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d141d; --surface:#152130; --sunk:#1b2a3c; --line:#26384d;
  --fg:#e6edf5; --muted:#93a3b6;
  --court:#163c6e; --court-ink:#f2f6fb; --ball:#d4e544; --ball-ink:#1c2604;
  --ok:#43c07a; --warn:#e3a94a; --bad:#ef6b5c;
  --t1:#f07083; --t2:#3fbdbd; --t3:#a888f0; --t4:#ea9d52; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--court)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ball);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Cabecera: la pista */
header.band{background:var(--court);color:var(--court-ink);position:relative;overflow:hidden}
header.band::after{content:"";position:absolute;inset:auto 0 0;height:3px;background:repeating-linear-gradient(90deg,var(--court-ink) 0 18px,transparent 18px 30px);opacity:.25}
header .wrap{padding-block:22px 20px;display:grid;gap:10px}
.eyebrow{font-family:var(--display);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:13px;opacity:.8}
h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,8vw,44px);line-height:.95;margin:0;text-wrap:balance;letter-spacing:.01em}
.meta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:13px}
.live{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.12);border-radius:99px;padding:4px 10px 4px 8px;border:0;cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ball);box-shadow:0 0 0 0 var(--ball)}
.live.on .dot{animation:pulse 2s infinite}
.live.off .dot{background:#f0a35c}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(217,234,60,.7)}70%{box-shadow:0 0 0 7px rgba(217,234,60,0)}100%{box-shadow:0 0 0 0 rgba(217,234,60,0)}}
@media (prefers-reduced-motion:reduce){.live.on .dot{animation:none}}
.meta a{opacity:.85}

main .wrap{padding-block:18px 40px;display:grid;gap:22px}
section{display:grid;gap:12px}
h2{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.02em;text-transform:uppercase;margin:0;display:flex;align-items:baseline;gap:10px}
h2 small{font-family:var(--body);font-weight:500;font-size:13px;text-transform:none;letter-spacing:0;color:var(--muted)}

/* Próximo partido: el marcador */
.next{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:grid}
.next-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;background:var(--sunk);font-size:13px;flex-wrap:wrap}
.next-body{display:grid;grid-template-columns:auto 1fr;gap:4px 18px;padding:16px;align-items:center}
.clock{font-family:var(--display);font-weight:700;font-size:64px;line-height:.85;letter-spacing:.01em;grid-row:span 2}
.next-body .who{font-weight:700;font-size:17px;min-width:0}
.next-body .vs{color:var(--muted);min-width:0;font-size:14px}
.countdown{font-family:var(--display);font-size:20px;font-weight:600;background:var(--ball);color:var(--ball-ink);border-radius:8px;padding:2px 10px;white-space:nowrap}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:99px;padding:2px 9px;background:var(--sunk);color:var(--fg);white-space:nowrap}
.chip.court{font-family:var(--display);font-size:14px;letter-spacing:.04em;background:var(--court);color:var(--court-ink)}
.chip.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.chip.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.chip.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.chip.live-now{background:var(--ball);color:var(--ball-ink)}
.tdot{width:10px;height:10px;border-radius:3px;background:var(--tc);flex:none}

/* Avisos */
.alerts{display:grid;gap:8px}
.alert{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:11px 14px;border-radius:12px;border:1px solid color-mix(in srgb,var(--ac) 40%,transparent);background:color-mix(in srgb,var(--ac) 9%,var(--surface));font-size:14px}
.alert b{display:block}
.alert .ico{font-family:var(--display);font-weight:700;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--ac);color:var(--surface);font-size:14px;margin-top:1px}

/* Parejas */
.teams{display:grid;gap:12px}
.team{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.team > summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:6px 1fr auto;gap:0 14px;align-items:stretch}
.team > summary::-webkit-details-marker{display:none}
.stripe{background:var(--tc)}
.team-head{padding:14px 0;min-width:0;display:grid;gap:3px}
.cat{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--tc)}
.pair{font-weight:700;font-size:16px;line-height:1.25}
.team-next{font-size:13px;color:var(--muted)}
.team-next strong{color:var(--fg)}
.team-side{padding:14px 14px 14px 0;display:grid;align-content:center;justify-items:end;gap:6px;text-align:right}
.big-time{font-family:var(--display);font-weight:700;font-size:30px;line-height:.9}
.team-body{border-top:1px solid var(--line);padding:6px 16px 16px;display:grid;gap:14px}
.sub{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:8px}

.mrow{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.mrow:last-child{border-bottom:0}
.when{font-family:var(--display);line-height:1;display:grid;gap:3px}
.when .d{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.when .h{font-size:24px;font-weight:700}
.mid{min-width:0;display:grid;gap:2px}
.mid .rnd{font-size:12px;color:var(--muted);font-weight:600}
.mid .opp{font-size:14px;overflow-wrap:anywhere}
.right{display:grid;justify-items:end;gap:5px}
.score{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.03em}
.mrow.maybe .when .h,.mrow.maybe .opp{opacity:.7}
.mrow.maybe .chip.court{background:transparent;color:var(--court);box-shadow:inset 0 0 0 1.5px var(--court)}
:root[data-theme="dark"] .mrow.maybe .chip.court{color:var(--court-ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mrow.maybe .chip.court{color:var(--court-ink)}}

.branches{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:460px){.branches{grid-template-columns:1fr}}
.branch{border-radius:12px;padding:10px 12px;background:var(--sunk);display:grid;gap:4px;min-width:0}
.branch .lbl{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.branch.win .lbl{color:var(--ok)}
.branch.lose .lbl{color:var(--bad)}
.branch .bwhen{font-weight:700}
.branch .bopp{font-size:13px;color:var(--muted);overflow-wrap:anywhere}

.path{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.path .step{background:var(--sunk);border-radius:8px;padding:5px 9px;display:grid;line-height:1.2}
.path .step b{font-family:var(--display);font-size:14px;letter-spacing:.04em}
.path .arrow{color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-size:13px;font-weight:600;text-decoration:none;cursor:pointer}
.btn:hover{border-color:var(--court)}
.cal{font-size:12px;font-weight:600;color:var(--court);text-decoration:none;white-space:nowrap}
:root[data-theme="dark"] .cal{color:var(--ball)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cal{color:var(--ball)}}

/* Agenda */
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.filters button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px 16px 8px}
.day h3{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.06em;text-transform:uppercase;margin:10px 0 2px;display:flex;justify-content:space-between;align-items:baseline}
.day h3 span{font-family:var(--body);font-size:12px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted)}
.ag{grid-template-columns:58px 1fr auto;position:relative;padding-left:12px}
.ag::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:2px;background:var(--tc)}
.ag.maybe::before{background:repeating-linear-gradient(180deg,var(--tc) 0 5px,transparent 5px 9px)}
.ag .when .d{font-family:var(--display);font-size:14px;letter-spacing:.04em;color:var(--muted);font-weight:700}
.ag .cat{font-size:12.5px}
.ag .pair{font-size:15px}
.ag.is-next{background:color-mix(in srgb,var(--ball) 14%,transparent);border-radius:10px;margin-inline:-8px;padding-inline:20px 8px}
.ag.is-next::before{left:8px}
.ag .tname{display:flex;align-items:center;gap:7px;font-weight:700;font-size:14px}
.ag.past{opacity:.55}
.empty{color:var(--muted);font-size:14px;padding:10px 0}

footer{color:var(--muted);font-size:12.5px;display:grid;gap:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.legend .chip.court.dash{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--muted)}
.skeleton{height:120px;border-radius:var(--r);background:var(--sunk)}
</style>

<script>
(() => {
const TID = "-P0c-Ek5aDiamycFMz6H";
const BASE = "https://sportelia-torneos.firebaseio.com/tournaments/";
const OFFICIAL = cat => `https://torneos.sportelia.es/#/tournaments-matches/${TID}/${cat}`;
const DUR_MIN = 60;
const REFRESH_MS = 60000;

// Las parejas que seguimos. "find" son trozos del nombre tal y como aparece en Sportelia (sin tildes).
const TEAMS = [
  { key:"f4", cat:"-P0c0KCVA9HLmbtUu-LS", label:"4ª Femenina", short:"4F", nice:"Carolina Dias Tomas · Irene Piza", find:["carol","piza"], color:"var(--t1)" },
  { key:"m4", cat:"-P0c0KCWF3GxfJfqdRVI", label:"4ª Masculina", short:"4M", nice:"Xisco R · Victor", find:["xisco r","victor"], color:"var(--t2)" },
  { key:"m5", cat:"-P0c0KCWF3GxfJfqdRVJ", label:"5ª Masculina", short:"5M", nice:"Esmeralda Diaz · Francisco Rotger Font", find:["rotger font"], color:"var(--t3)" },
  { key:"mx", cat:"-P0c0KCWF3GxfJfqdRVK", label:"Mixto", short:"MX", nice:"Xisco R · Margarita Tomas Tomas", find:["xisco r","margarita"], color:"var(--t4)" },
];
// Personas que juegan en más de una categoría (para avisar de solapes).
const SHARED = [{ who:"Xisco", teams:["m4","mx"] }];

const $ = s => document.querySelector(s);
const norm = s => (s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/\s+/g," ").trim();
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

// ---- Fechas en hora de Mallorca (Europe/Madrid). El domingo 25 cambia la hora (CEST -> CET).
function lastSundayUTC(y, m){ const d = new Date(Date.UTC(y, m+1, 0)); d.setUTCDate(d.getUTCDate() - d.getUTCDay()); return d; }
function madridOffsetHours(utcMs){
  const y = new Date(utcMs).getUTCFullYear();
  const start = lastSundayUTC(y, 2).getTime() + 3600e3, end = lastSundayUTC(y, 9).getTime() + 3600e3;
  return (utcMs >= start && utcMs < end) ? 2 : 1;
}
function matchDate(sch){
  if (!sch || !sch.day || !sch.hourName) return null;
  const [Y,M,D] = sch.day.split("-").map(Number), [h,mi] = sch.hourName.split(":").map(Number);
  let guess = Date.UTC(Y, M-1, D, h, mi) - 2*3600e3;
  guess = Date.UTC(Y, M-1, D, h, mi) - madridOffsetHours(guess)*3600e3;
  return new Date(guess);
}
const DAYS = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
const DAYS_LONG = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
function dayLabel(sch){ const [Y,M,D] = sch.day.split("-").map(Number); return DAYS[new Date(Date.UTC(Y,M-1,D)).getUTCDay()] + " " + D; }
function dayLong(day){ const [Y,M,D] = day.split("-").map(Number); return DAYS_LONG[new Date(Date.UTC(Y,M-1,D)).getUTCDay()] + " " + D; }
function court(sch){ return (sch?.courtName || "").replace(/^Pista\s*/i, "P"); }
function relTime(ms){
  const m = Math.round(ms/60000);
  if (m < 1) return "ya";
  if (m < 60) return `en ${m} min`;
  const h = Math.floor(m/60), r = m % 60;
  if (h < 24) return r ? `en ${h} h ${r} min` : `en ${h} h`;
  const d = Math.floor(h/24), hh = h % 24;
  return hh ? `en ${d} d ${hh} h` : `en ${d} d`;
}
function gcal(title, start, details, loc){
  const f = d => d.toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"");
  const end = new Date(start.getTime() + DUR_MIN*60000);
  const p = new URLSearchParams({ action:"TEMPLATE", text:title, dates:`${f(start)}/${f(end)}`, details, location:loc });
  return "https://calendar.google.com/calendar/render?" + p.toString();
}

// ---- Lógica del cuadro
const isBye = t => /^bye$/i.test((t?.name||"").trim());
function setsText(m, side){
  const s = m.score; if (!s || !s.home || !s.away) return "";
  const other = side === "home" ? "away" : "home";
  return ["set1","set2","set3"].filter(k => s.home[k] != null && s.away[k] != null && (s.home[k] !== "" || s.away[k] !== ""))
    .map(k => `${s[side][k]}-${s[other][k]}`).join("  ");
}
function winnerSide(m){
  const s = m.score; if (!s) return null;
  if (s.winner) return s.winner;
  if (s.home?.winner === true) return "home";
  if (s.away?.winner === true) return "away";
  return null;
}
function outcomeFor(m, side){
  const w = winnerSide(m);
  if (w) return w === side ? "win" : "loss";
  const other = side === "home" ? "away" : "home";
  if (isBye(m.teams?.[other])) return "bye";
  return null;
}
function dest(m, pos){ const n = m.nextRound?.["position_"+pos]; return n ? { num:n.destination, side:n.team } : null; }

function analyse(data, team){
  const all = Object.values(data.matches).filter(m => m.categoryId === team.cat);
  const byNum = Object.fromEntries(all.map(m => [m.num, m]));
  const f = team.find.map(norm);
  let id = null, name = team.nice;
  for (const m of all) for (const side of ["home","away"]) {
    const t = m.teams?.[side];
    if (t && f.every(x => norm(t.name).includes(x))) { id = t.inscriptionId || null; name = t.name; }
    if (id) break;
  }
  const mine = all.filter(m => ["home","away"].some(s => id ? m.teams?.[s]?.inscriptionId === id : f.every(x => norm(m.teams?.[s]?.name).includes(x))))
    .map(m => ({ m, side: ["home","away"].find(s => id ? m.teams?.[s]?.inscriptionId === id : f.every(x => norm(m.teams?.[s]?.name).includes(x))) }))
    .sort((a,b) => (a.m.roundOrder||0) - (b.m.roundOrder||0) || (matchDate(a.m.schedule)||0) - (matchDate(b.m.schedule)||0));

  const rows = mine.map(({m, side}) => {
    const other = side === "home" ? "away" : "home";
    return { m, side, opp: m.teams?.[other]?.name || "Por decidir", out: outcomeFor(m, side), date: matchDate(m.schedule), confirmed: true };
  });

  // Dónde está ahora la pareja: el primer partido confirmado sin resultado; si no hay, el destino del último resultado.
  let current = rows.find(r => !r.out) || null;
  let status = "pending";
  const last = rows[rows.length - 1];
  if (!current && last) {
    const won = last.out === "win" || last.out === "bye";
    const d = dest(last.m, won ? 1 : 2);
    if (d && byNum[d.num]) {
      const m = byNum[d.num], other = d.side === "home" ? "away" : "home";
      current = { m, side: d.side, opp: m.teams?.[other]?.name || "Por decidir", out: null, date: matchDate(m.schedule), confirmed: true, inferred: true };
      rows.push(current);
    } else status = won && !last.m.nextRound ? "champions" : (won ? "done" : "out");
  }
  // Un BYE cuenta como pase directo: el partido real es el siguiente.
  while (current && current.out === "bye") {
    const d = dest(current.m, 1), m = d && byNum[d.num];
    if (!m) break;
    const other = d.side === "home" ? "away" : "home";
    const ex = rows.find(r => r.m.num === m.num);
    current = ex || { m, side: d.side, opp: m.teams?.[other]?.name || "Por decidir", out: null, date: matchDate(m.schedule), confirmed: true, inferred: true };
    if (!ex) rows.push(current);
    if (current.out && current.out !== "bye") { current = rows.find(r => !r.out) || null; break; }
  }

  // Ramas desde el partido actual.
  const chain = (start) => {
    const out = []; let d = start, guard = 0;
    while (d && byNum[d.num] && guard++ < 8) {
      const m = byNum[d.num], other = d.side === "home" ? "away" : "home";
      out.push({ m, side: d.side, opp: m.teams?.[other]?.name || "Por decidir", date: matchDate(m.schedule), confirmed:false });
      d = dest(m, 1);
    }
    return out;
  };
  let ifWin = [], ifLose = [], loseEnds = false;
  if (current) {
    ifWin = chain(dest(current.m, 1));
    const ld = dest(current.m, 2);
    ifLose = ld ? chain(ld) : [];
    loseEnds = !ld;
  }
  return { team, id, name, rows, current, status, ifWin, ifLose, loseEnds, byNum };
}

// ---- Cambios de horario (se guardan en este móvil)
function trackChanges(data){
  const seen = store.get("pp-seen", {}), changes = store.get("pp-changes", []);
  const now = Date.now(), cats = new Set(TEAMS.map(t => t.cat));
  let first = Object.keys(seen).length === 0;
  for (const m of Object.values(data.matches)) {
    if (!cats.has(m.categoryId) || !m.schedule) continue;
    const sig = `${m.schedule.day}|${m.schedule.hourName}|${m.schedule.courtName}`;
    if (!first && seen[m.num] && seen[m.num] !== sig) {
      const [d0,h0,c0] = seen[m.num].split("|");
      changes.push({ num:m.num, at:now, before:`${dayLabel({day:d0})} ${h0} · ${c0}`, after:`${dayLabel(m.schedule)} ${m.schedule.hourName} · ${m.schedule.courtName}` });
    }
    seen[m.num] = sig;
  }
  const fresh = changes.filter(c => now - c.at < 12*3600e3);
  store.set("pp-seen", seen); store.set("pp-changes", fresh);
  return Object.fromEntries(fresh.map(c => [c.num, c]));
}

// ---- Render
let state = { data:null, live:false, fetchedAt:null, filter: store.get("pp-filter","all"), maybe: store.get("pp-maybe", false) };

function chipFor(r, now){
  if (r.out === "win") return `<span class="chip ok">Ganado</span>`;
  if (r.out === "loss") return `<span class="chip bad">Perdido</span>`;
  if (r.out === "bye") return `<span class="chip ok">Pase directo</span>`;
  if (r.date && now >= r.date && now < r.date.getTime() + DUR_MIN*60000) return `<span class="chip live-now">Jugando</span>`;
  return "";
}
function matchRow(r, team, now, changes, opts = {}){
  const sch = r.m.schedule || {};
  const sc = r.out === "win" || r.out === "loss" ? setsText(r.m, r.side) : "";
  const ch = changes[r.m.num];
  const cal = r.date && !r.out && r.date > now
    ? `<a class="cal" target="_blank" rel="noopener" href="${esc(gcal(`Pádel ${team.label}: ${r.m.serie}`, r.date, `${team.nice} vs ${r.opp}\n${sch.courtName}`, "Smy Portocolom, Carrer dels Germans Pinzón 18, Portocolom"))}">+ Calendario</a>` : "";
  return `<div class="mrow ${r.confirmed ? "" : "maybe"} ${opts.cls||""}">
    <div class="when"><span class="d">${esc(dayLabel(sch))}</span><span class="h num">${esc(sch.hourName||"--:--")}</span></div>
    <div class="mid">
      <span class="rnd">${opts.teamLabel ? `<span class="tname"><span class="tdot" style="--tc:${team.color}"></span>${esc(team.label)}</span>` : ""}${esc(r.m.serie || r.m.num)}${opts.cond ? ` · <em>${esc(opts.cond)}</em>` : ""}</span>
      <span class="opp">vs ${esc(r.opp)}</span>
      ${ch ? `<span class="chip warn" title="Antes: ${esc(ch.before)}">Cambiado · antes ${esc(ch.before)}</span>` : ""}
    </div>
    <div class="right">
      <span class="chip court">${esc(court(sch))}</span>
      ${sc ? `<span class="score num">${esc(sc)}</span>` : ""}
      ${chipFor(r, now)}
      ${cal}
    </div>
  </div>`;
}

function calRow(it, now, changes, isNext){
  const { a, r, cond } = it, team = a.team, sch = r.m.schedule || {};
  const sc = r.out === "win" || r.out === "loss" ? setsText(r.m, r.side) : "";
  const ch = changes[r.m.num];
  const done = r.out || (r.date && r.date.getTime() + DUR_MIN*60000 < now);
  const cal = r.date && !r.out && r.date > now
    ? `<a class="cal" target="_blank" rel="noopener" href="${esc(gcal(`Pádel ${team.label}: ${team.nice}`, r.date, `${r.m.serie} vs ${r.opp}\n${sch.courtName}`, "Smy Portocolom, Carrer dels Germans Pinzón 18, Portocolom"))}">+ Calendario</a>` : "";
  return `<div class="mrow ag ${r.confirmed ? "" : "maybe"} ${done ? "past" : ""} ${isNext ? "is-next" : ""}" style="--tc:${team.color}">
    <div class="when"><span class="h num">${esc(sch.hourName||"--:--")}</span><span class="d">${esc(court(sch))}</span></div>
    <div class="mid">
      <span class="cat">${esc(team.label)} · ${esc(r.m.serie || r.m.num)}</span>
      <span class="pair">${esc(team.nice)}</span>
      <span class="opp">vs ${esc(r.opp)}${cond ? ` · <em>${esc(cond)}</em>` : ""}</span>
      ${ch ? `<span class="chip warn">Cambiado · antes ${esc(ch.before)}</span>` : ""}
    </div>
    <div class="right">
      ${isNext ? `<span class="chip live-now">${now >= r.date ? "Jugando" : esc(relTime(r.date - now))}</span>` : chipFor(r, now)}
      ${sc ? `<span class="score num">${esc(sc)}</span>` : ""}
      ${cal}
    </div>
  </div>`;
}

function render(){
  const { data } = state; if (!data) return;
  const now = new Date();
  const changes = trackChanges(data);
  const A = TEAMS.map(t => analyse(data, t));

  // Próximo partido confirmado (se marca en el calendario).
  const upcoming = A.flatMap(a => a.rows.filter(r => !r.out && r.date && r.date.getTime() + DUR_MIN*60000 > now).map(r => ({ a, r })))
    .sort((x,y) => x.r.date - y.r.date);
  const nextKey = upcoming[0] ? upcoming[0].a.team.key + upcoming[0].r.m.num : null;

  // Avisos: solapes de la misma persona en dos categorías.
  const alerts = [];
  for (const sh of SHARED) {
    const [a1, a2] = sh.teams.map(k => A.find(a => a.team.key === k));
    const cand = a => [
      ...(a.current ? [{ r:a.current, cond:null }] : []),
      ...a.rows.filter(r => !r.out && r !== a.current).map(r => ({ r, cond:null })),
      ...a.ifWin.map((r,i) => ({ r, cond: i === 0 ? "si ganan" : "si siguen ganando" })),
      ...a.ifLose.map((r,i) => ({ r, cond: i === 0 ? "si pierden" : "si pierden y luego ganan" })),
    ].filter(x => x.r.date && x.r.date > now);
    const seen = new Set();
    for (const x of cand(a1)) for (const y of cand(a2)) {
      const gap = Math.abs(x.r.date - y.r.date) / 60000;
      const k = x.r.m.num + y.r.m.num; if (seen.has(k)) continue;
      if (gap < DUR_MIN) {
        seen.add(k);
        const sure = !x.cond && !y.cond;
        if (!sure) continue; // solo avisamos de solapes ya confirmados
        alerts.push({ sure, html:`<div class="alert" style="--ac:var(${sure ? "--bad" : "--warn"})"><span class="ico">!</span><div><b>${sure ? "Solape" : "Posible solape"} de ${esc(sh.who)}: ${esc(dayLabel(x.r.m.schedule))}</b>
          ${esc(a1.team.label)} ${esc(x.r.m.serie)} a las ${esc(x.r.m.schedule.hourName)} (${esc(x.r.m.schedule.courtName)})${x.cond ? `, ${esc(x.cond)}` : ""}, y ${esc(a2.team.label)} ${esc(y.r.m.serie)} a las ${esc(y.r.m.schedule.hourName)} (${esc(y.r.m.schedule.courtName)})${y.cond ? `, ${esc(y.cond)}` : ""}. Conviene avisar a la organización.</div></div>` });
      }
    }
  }
  const chs = Object.values(changes);
  if (chs.length) alerts.unshift({ html:`<div class="alert" style="--ac:var(--warn)"><span class="ico">↻</span><div><b>Han cambiado ${chs.length === 1 ? "un horario" : chs.length + " horarios"} en las últimas horas</b>Están marcados como «Cambiado» en la lista.</div></div>` });
  alerts.sort((a,b) => (b.sure?1:0) - (a.sure?1:0));
  $("#alerts").innerHTML = alerts.map(a => a.html).join("");

  // Filtros y calendario.
  const f = state.filter, maybe = state.maybe;
  $("#filters").innerHTML = [`<button type="button" data-f="all" aria-pressed="${f==="all"}">Todas</button>`,
    ...TEAMS.map(t => `<button type="button" data-f="${t.key}" aria-pressed="${f===t.key}"><span class="tdot" style="--tc:${t.color}"></span>${esc(t.short)}</button>`),
    `<button type="button" data-m="1" aria-pressed="${maybe}">+ posibles</button>`].join("");
  $("#filters").querySelectorAll("button[data-f]").forEach(b => b.onclick = () => { state.filter = b.dataset.f; store.set("pp-filter", state.filter); render(); });
  $("#filters").querySelector("button[data-m]").onclick = () => { state.maybe = !state.maybe; store.set("pp-maybe", state.maybe); render(); };

  const uniq = new Map();
  const add = (a, r, cond) => { const k = a.team.key + r.m.num; if (!uniq.has(k)) uniq.set(k, { a, r, cond, k }); };
  for (const a of A) {
    if (f !== "all" && f !== a.team.key) continue;
    a.rows.forEach(r => add(a, r, null));
    if (maybe) {
      a.ifWin.forEach((r,i) => add(a, r, i === 0 ? "si ganan" : "si siguen ganando"));
      a.ifLose.forEach((r,i) => add(a, r, i === 0 ? "si pierden" : "si pierden y luego ganan"));
    }
  }
  const byDay = {};
  [...uniq.values()].filter(it => it.r.m.schedule?.day).sort((x,y) => x.r.date - y.r.date || x.a.team.key.localeCompare(y.a.team.key))
    .forEach(it => (byDay[it.r.m.schedule.day] ||= []).push(it));
  const days = Object.keys(byDay).sort();
  $("#agenda").innerHTML = days.length ? days.map(d => `<div class="day"><h3>${esc(dayLong(d))}<span>${byDay[d].filter(i => !i.cond).length} confirmados</span></h3>
    ${byDay[d].map(it => calRow(it, now, changes, it.k === nextKey)).join("")}</div>`).join("")
    : `<div class="empty">No hay partidos para este filtro.</div>`;
  if (!maybe) $("#agenda").insertAdjacentHTML("beforeend", `<div class="empty">Pulsa «+ posibles» para ver también los partidos que dependen de los resultados.</div>`);

  // Estado de la conexión.
  const live = $("#live");
  live.className = "live " + (state.live ? "on" : "off");
  const t = state.fetchedAt ? state.fetchedAt.toLocaleTimeString("es-ES", { hour:"2-digit", minute:"2-digit" }) : "";
  $("#liveText").textContent = state.live ? `En directo · ${t}` : `Copia de las ${t} (sin conexión con Sportelia)`;
}

async function getJSON(path){
  const r = await fetch(BASE + path + "/" + TID + ".json", { cache:"no-store" });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
async function load(){
  try {
    const [matches, pub] = await Promise.all([getJSON("matches"), getJSON("public").catch(() => null)]);
    if (!matches) throw new Error("vacío");
    state.data = { matches, pub };
    state.live = true; state.fetchedAt = new Date();
  } catch (e) {
    if (!state.data && SNAPSHOT) { state.data = SNAPSHOT; state.fetchedAt = new Date(SNAPSHOT.at); }
    state.live = false;
  }
  if (state.data?.pub?.name) $("#tname").textContent = state.data.pub.name.toLowerCase().replace(/(^|\s|&)\S/g, s => s.toUpperCase()).replace("Padel","Pádel");
  render();
}

$("#live").onclick = load;
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
setInterval(() => { if (!document.hidden) load(); }, REFRESH_MS);
setInterval(() => { if (!document.hidden) render(); }, 20000);
load();
})();
</script>
